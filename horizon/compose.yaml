name: appdev-gitea-analytics

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_ANALYTICS_DB:-gitea_analytics}
      POSTGRES_USER: ${GITEA_ANALYTICS_USER:-gitea_analytics}
      POSTGRES_PASSWORD: ${GITEA_ANALYTICS_PASSWORD:?set GITEA_ANALYTICS_PASSWORD before starting Postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gitea-analytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gitea-analytics-postgres-data:
