name: PR Format Check

on:
  pull_request:
    branches: ["master"]
    paths:
      - "peopleportal/**"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/pr_format.yml"

  workflow_dispatch:

concurrency:
  group: "pr-format-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Keep in sync with pr_build.yml and the deploy workflows

      - name: Check formatting
        # Prettier is pinned so a new release cannot change the output underneath us.
        # Run `npx prettier@3.9.10 --write peopleportal/webui/src peopleportal/server/src` to fix failures.
        run: npx --yes prettier@3.9.10 --check peopleportal/webui/src peopleportal/server/src
