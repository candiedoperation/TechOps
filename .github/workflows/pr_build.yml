name: PR Build Check

on:
  pull_request:
    branches: ["master"]
    paths:
      - "peopleportal/**"
      - "landing-v3/**"
      - ".nx/**"
      - "nx.json"
      - "nx"
      - ".github/workflows/pr_build.yml"

  workflow_dispatch:

concurrency:
  group: "pr-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Keep in sync with deploy_peopleportal.yml and deploy_landingv3.yml

      - name: Build with Nx
        # Same build the deploy workflows run, so a PR that cannot build fails before it merges
        run: ./nx run-many -t build -p pplserver pplui landing-v3
