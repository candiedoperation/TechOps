# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Loaded by the worker. Secrets come from its environment, never this file.
version: 1
metadata:
  name: AppDev People Portal and Gitea
  labels:
    blueprints.goauthentik.io/instantiate: "true"
# Keep the required signing_key lookups below: never fall back to HS256.
# The certificate is created by authentik crypto reconciliation, not a blueprint.
# bootstrap-authentik.sh waits for it, then reapplies this blueprint if needed.
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-invalidation-flow.yaml
      required: true

  - model: authentik_providers_oauth2.scopemapping
    id: people-portal-scope
    identifiers:
      name: AppDev People Portal claims
    attrs:
      scope_name: people_portal
      description: People Portal identity and authorization claims
      expression: |
        return {
            "pk": request.user.pk,
            "is_superuser": request.user.is_superuser,
            "attributes": request.user.attributes,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: people-portal-provider
    identifiers:
      name: AppDev People Portal
    attrs:
      client_type: confidential
      client_id: !Env PORTAL_OIDC_CLIENT_ID
      client_secret: !Env PORTAL_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf people-portal-scope
      # Strict URLs match the host server's base URL exactly.
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Format ["%s/api/auth/redirect", !Env PORTAL_BASE_URL]
        - matching_mode: strict
          redirect_uri_type: logout
          url: !Format ["%s/", !Env PORTAL_BASE_URL]

  - model: authentik_core.application
    identifiers:
      slug: people-portal
    attrs:
      name: People Portal (dev)
      provider: !KeyOf people-portal-provider
      meta_launch_url: !Env PORTAL_BASE_URL

  # Gitea gets its own client, so portal redirects do not authorize Gitea logins.
  - model: authentik_providers_oauth2.oauth2provider
    id: gitea-provider
    identifiers:
      name: AppDev Gitea
    attrs:
      client_type: confidential
      client_id: !Env GITEA_OIDC_CLIENT_ID
      client_secret: !Env GITEA_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf people-portal-scope
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/user/oauth2/authentik/callback", !Env GITEA_URL]

  - model: authentik_core.application
    identifiers:
      slug: gitea
    attrs:
      name: Gitea (dev)
      provider: !KeyOf gitea-provider
      meta_launch_url: !Env GITEA_URL
